const icon=k=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]||paths.arrow}"/></svg>`;
const mark=(other=false)=>`<svg class="mark" viewBox="0 0 48 54" aria-hidden="true"><path d="M4 3h40v31L24 51 4 34Z" fill="${other?'#80513b':'#174a67'}" stroke="${other?'#e4b58f':'#d1a34a'}" stroke-width="2"/>${other?'<path d="m13 31 11-18 11 18m-17-7h12" fill="none" stroke="#fff" stroke-width="3"/>':'<path d="M34 18a13 13 0 1 0 0 18V27H24" fill="none" stroke="#fff" stroke-width="3"/><path d="m15 8 9 5 9-5" fill="none" stroke="#d1a34a" stroke-width="2"/>'}</svg>`;
const jersey=(big=false,num='12')=>`<svg class="jersey ${big?'big':''}" viewBox="0 0 90 100" role="img" aria-label="Gateway jersey number ${num}"><path d="m29 10-20 11-7 23 17 6 4-10v49h44V40l4 10 17-6-7-23-20-11c-7 8-25 8-32 0Z" fill="#174a67"/><path d="m29 10 5 14h22l5-14M6 35l14 5m50 0 14-5" fill="none" stroke="#d1a34a" stroke-width="4"/><text x="45" y="67" fill="white" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="800">${num}</text><path d="M23 84h44" stroke="#d1a34a" stroke-width="3"/></svg>`;
const facility=()=>`<svg class="facility-art" viewBox="0 0 480 170" role="img" aria-label="Illustrative Gateway strength facility"><path d="M0 137 140 99l340 22v49H0" fill="#d4dfcd"/><path d="m94 66 162-35 125 42-156 37Z" fill="#c2bba8"/><path d="m94 66 131 44v50L94 113Z" fill="#b4b09d"/><path d="m225 110 156-37v52l-156 35Z" fill="#ebe7da"/><path d="m110 78 18 6v33l-18-6m11-33 20 6v33l-20-6" fill="#174a67"/><path d="m245 116 104-25v31l-104 25Z" fill="#174a67"/><path d="m274 108 0 31m30-39v32m29-39v32" stroke="#91afba" stroke-width="3"/><path d="m243 92 90-21" stroke="#d1a34a" stroke-width="6"/><path d="m46 124 0-34m367 42V88" stroke="#7d8970" stroke-width="5"/><circle cx="46" cy="84" r="20" fill="#90a785"/><circle cx="413" cy="78" r="24" fill="#8aa47e"/></svg>`;
const pill=(text,type='')=>`<span class="pill ${type}">${text}</span>`;
const metric=(label,value,foot='',cls='')=>`<div class="metric"><span class="muted small">${label}</span><strong class="number ${cls}">${value}</strong><p class="muted">${foot}</p></div>`;
const item=(label,value)=>`<div class="line-item"><span>${label}</span><strong class="number">${value}</strong></div>`;
const head=(eyebrow,title,sub='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`;
const btn=(label,action,cls='primary',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
function home(){return head('Your program',state.played?'A week worth building on.':'Small school. Big possibilities.')+`<div class="grid home-grid"><div class="stack"><section class="card money-card"><div class="card-head"><h2>The business of football</h2>${btn('View business →','business','text-button')}</div><div class="pair">${metric('School cash',money(state.cash),'Available today')}${metric('Season outlook','+$85–120K','Illustrative operating surplus','positive')}</div><details><summary>What does the outlook include?</summary><p>Sample remaining-season operating income less expenses, before new projects and contract changes. This prototype does not recalculate a forecast or simulate your career.</p></details></section><section class="card changes"><div class="card-head"><h2>Worth your attention</h2>${pill('2 opportunities','neutral')}</div><button class="news-row" data-action="staff"><span class="symbol">${icon('staff')}</span><span><strong>${state.hired?'Your new coordinator is selected':'A developer for your offense'}</strong><p>${state.hired?'Marcus Bell · demo appointment':'Marcus Bell is available. Compare your staff.'}</p></span><span class="chevron">↗</span></button><button class="news-row" data-action="business"><span class="symbol gold">${icon('coin')}</span><span><strong>${state.media?'Local TV offer selected':'A local audience. A new opportunity.'}</strong><p>${state.media?'Review the sample terms in Business.':'Gateway Sports offers $13K a week.'}</p></span><span class="chevron">↗</span></button></section><section class="card feature"><div class="eyebrow">People to believe in</div><div class="person">${jersey()}<div><strong>Darren Price</strong><p>QB · Freshman · No. 12</p>${pill('Developing','neutral')}</div></div><blockquote>Overlooked on signing day.<br>Now finding his feet.</blockquote><p class="small muted" style="margin-top:10px">Promising arm. His upside is still uncertain.</p>${btn('Follow his progress →','players','text-button')}</section></div><div class="stack"><section class="card match"><div class="card-head"><span class="eyebrow">${state.played?'Coming up · Week 7':'Saturday · Week 6'}</span><span class="small">Home</span></div><div class="teams"><div>${mark()}<strong>Gateway</strong><small>${state.played?'3–2':'2–2'}</small></div><span class="versus">VS</span><div>${mark(true)}<strong>${state.played?'Bluegrass':'Twin Rivers'}</strong><small>${state.played?'4–1':'3–1'}</small></div></div>${btn(state.played?'Review sample result':'Advance demo week','advance','primary full')}<p class="match-note">${state.played?'One sample week · reset to replay':'Your coaches have the plan covered.'}</p></section><section class="card growth"><div class="card-head"><h2>A following takes shape</h2>${pill('+21%','neutral')}</div>${metric('Local fans','18,420','Sample first five weeks')}<div class="chart" role="img" aria-label="Illustrative fan growth: 15,200 in week 1 to 18,420 in week 5"><div class="bar" style="height:43%"></div><div class="bar" style="height:55%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:79%"></div><div class="bar" style="height:94%"></div></div><div class="chart-labels"><span>WEEK 1</span><span>WEEK 5</span></div><div class="divider"></div><p class="small muted">A bigger audience creates opportunities. Profit still depends on what you spend.</p></section></div></div>`}
function player(){let content=state.tab==='football'?`<section class="card"><div class="card-head"><h2>Finding his game</h2>${pill('Starter','neutral')}</div><div class="attributes"><div class="attribute"><strong>71</strong><span>Arm strength</span></div><div class="attribute"><strong>64</strong><span>Accuracy</span></div><div class="attribute"><strong>60</strong><span>Awareness</span></div></div><div class="divider"></div><div class="eyebrow">Scout assessment · Week 5</div><h3 style="margin:9px 0">A useful starter. Possibly more.</h3><p class="small muted">Good tools, inconsistent decisions. More game experience should help us judge his upside.</p><div style="margin-top:12px">${pill('Medium confidence','amber')}</div><details><summary>About this estimate</summary><p>Illustrative scout opinion, not a guaranteed floor or ceiling. No exact hidden potential is shown. These ratings are sample content and do not update from the game engine.</p></details></section><section class="card"><h2>A sustainable workload</h2><p class="small muted" style="margin-top:12px">Football first. One community appearance this month, with recovery time protected.</p><div class="divider"></div>${pill('Plan unchanged','neutral')}<p class="small muted" style="margin-top:10px">Wellbeing scenarios are planned; they are not simulated in this preview.</p></section>`:state.tab==='career'?`<section class="card"><h2 style="margin-bottom:24px">Every career starts somewhere</h2><ol class="timeline"><li><small>PRESEASON</small><strong>An overlooked signing</strong><p>Joined Gateway with limited scouting coverage.</p></li><li><small>WEEK 2</small><strong>His first start</strong><p>Earned the job after a steady week of practice.</p></li><li><small>WEEK 5</small><strong>The picture gets clearer</strong><p>Scout confidence improved. His future remains uncertain.</p></li>${state.played?'<li><small>WEEK 6 · SAMPLE RESULT</small><strong>A Saturday to remember</strong><p>242 passing yards and two touchdowns against Twin Rivers.</p></li>':''}</ol></section>`:`<section class="card"><div class="card-head"><h2>Small beginnings</h2>${pill('Active sample','neutral')}</div><div class="pair">${metric('Player earnings','$960','This season')}${metric('School contribution','$1,920','After campaign costs')}</div><div class="divider"></div><h3>No. 12 jersey collection</h3>${item('Sold / produced','64 / 100')}${item('Sales receipts','$4,800')}${item('Production and distribution','$1,920')}${item('Player share · 20% of sales','$960')}<details><summary>Where the money goes</summary><p>$4,800 receipts − $1,920 campaign costs − $960 player share = $1,920 school contribution. Thirty-six jerseys remain unsold. These are illustrative accounting totals, not a live campaign.</p></details></section>`;
return `<button class="back" data-action="home">← Back to Home</button><div class="profile-header">${jersey(true)}<div><div class="eyebrow">Gateway · No. 12</div><h1>Darren Price</h1><p class="muted">Quarterback · Freshman</p><div style="margin-top:9px">${pill('Developing','neutral')}</div></div></div><div class="tabs" aria-label="Player sections">${['football','career','agreements'].map(t=>`<button data-tab="${t}" aria-pressed="${state.tab===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="grid"><div class="stack">${content}</div><div class="stack"><section class="card feature"><div class="eyebrow">An investment, not a guarantee</div><h2 style="margin:12px 0">Give him a chance to grow.</h2><p class="small muted">Good coaching and facilities improve his opportunities. They cannot promise a star.</p>${btn('Meet his coaches →','staff','text-button')}</section><section class="card"><h2>Recruiting & transfers</h2><p class="small muted" style="margin-top:12px">The full roster, recruiting board, and portal will live here.</p><div style="margin-top:15px">${pill('Not connected in preview','neutral')}</div></section></div></div>`}
function staff(){return head('Staff','The people behind the program.','Choose an approach. Let your coaches do their work.')+`<div class="staff-grid"><section class="card staff-card ${!state.hired?'selected':''}"><span class="eyebrow">${state.hired?'Previous coordinator':'Current coordinator'}</span><div class="person"><div class="avatar" aria-label="Cedric Newman initials">CN</div><div><h2>Cedric Newman</h2><p>Offensive coordinator · Pro balanced</p></div></div><span class="trait">Film specialist</span><span class="trait">Familiar system</span><div class="money-list">${item('Salary / year','$240,000')}${item('Contract remaining','1 season')}${item('Buyout','$50,000')}</div><p class="small muted">Continuity for a young offense. Strong preparation, modest player development.</p><div class="divider"></div>${pill(state.hired?'Replaced in demo':'Staff plan active','neutral')}</section><section class="card staff-card ${state.hired?'selected':''}"><span class="eyebrow">${state.hired?'Selected in demo':'Available candidate'}</span><div class="person"><div class="avatar" aria-label="Marcus Bell initials">MB</div><div><h2>Marcus Bell</h2><p>Offensive coordinator · Pro balanced</p></div></div><span class="trait">QB developer</span><span class="trait">Regional recruiter</span><div class="money-list">${item('Salary / year','$340,000')}${item('Proposed term','2 seasons')}${item('Additional annual salary','+$100,000')}</div><p class="small muted">A development-led approach. Better support for young quarterbacks, with a larger payroll.</p><div class="button-group">${btn(state.hired?'Selected in demo':'Compare & hire','hire','primary full',state.hired?'disabled':'')}</div></section></div><section class="card" style="margin-top:20px"><div class="card-head"><h2>The rest of your staff</h2>${pill('No action needed','neutral')}</div><div class="row"><div class="person"><div class="avatar">CD</div><div><strong>Chris Dixon</strong><p>Defensive coordinator · Zone blitz</p></div></div><span class="small muted">Retained</span></div><div class="divider"></div><div class="row"><div class="person"><div class="avatar">DJ</div><div><strong>Darius Jenkins</strong><p>Strength coach · Development & recovery</p></div></div><span class="small muted">Retained</span></div></section><p class="small muted" style="margin-top:16px">Initials are temporary identity graphics. Staff contracts and effects are illustrative.</p>`}
function business(){return head('Business','Build beyond Saturday.','Put your money where you see opportunity.')+`<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>Your operating position</h2>${pill('School account','neutral')}</div><div class="pair">${metric('Available cash',money(state.cash),'After demo selections')}${metric('External NIL funds','$35,000','Separate partner pool')}</div><div class="cashbar"><span></span></div><p class="small muted">Player and partner funds are separate from school spending.</p><details><summary>Sample cash movement</summary>${item('Opening demo cash','$480,000')}${item('Coordinator buyout',state.hired?'−$50,000':'$0')}${item('Facility project',state.facility?'−$180,000':'$0')}${item('Sample week net',state.played?'+$42,000':'$0')}<p>Selection demonstrates cash commitments only. Recurring salaries, maintenance, and media payments are not simulated.</p></details></section><section class="card"><div class="card-head"><h2>A stronger foundation</h2>${pill(state.facility?'Scheduled in demo':'Investment','neutral')}</div>${facility()}<h3>Upgrade the strength facility</h3><p class="small muted" style="margin-top:8px">More capacity for supervised strength training. Your coaches and players determine the payoff.</p><div class="money-list">${item('Cost now','$180,000')}${item('Annual upkeep','$12,000')}${item('Construction','8 weeks')}</div>${btn(state.facility?'Project selected':'Review investment','facility','primary full',state.facility?'disabled':'')}<p class="small muted" style="margin-top:12px">${state.facility?'Construction does not progress in this prototype.':'Better facilities improve opportunity, not guaranteed ratings.'}</p></section></div><div class="stack"><section class="card"><div class="card-head"><h2>Get on the air</h2>${pill(state.media?'Selected':'Offer','neutral')}</div><div class="person"><div class="deal-logo">GTV</div><div><strong>Gateway Sports</strong><p>Local television · Fictional partner</p></div></div><div class="money-list">${item('Guaranteed weekly fee','$13,000')}${item('Term','8 weeks')}${item('Total contract value','$104,000')}</div><p class="small muted">Exclusive local TV rights for this sample term. National rights excluded.</p><div class="button-group">${btn(state.media?'Offer selected':'Review offer','media','secondary full',state.media?'disabled':'')}</div></section><section class="card"><div class="card-head"><h2>A name fans are learning</h2>${pill('Merchandise','neutral')}</div><div class="person">${jersey()}<div><strong>The No. 12 collection</strong><p>64 sold · 36 remaining</p></div></div><div class="divider"></div>${item('School contribution','$1,920')}${item('Player earnings','$960')}${btn('View player agreement →','agreements','text-button')}</section><div class="notice">Sample economics only. Future media, NIL, facilities, and player campaigns are not connected to your saved game.</div></div></div>`}
function league(){return head('League','A season taking shape.','Gateway’s place in a larger world.')+`<div class="grid"><section class="card"><div class="card-head"><h2>Great Lakes Division</h2>${pill('Sample standings','neutral')}</div><div class="table-wrap"><table><thead><tr><th>TEAM</th><th>RECORD</th></tr></thead><tbody><tr><td>1 · Lake Erie</td><td>5–0</td></tr><tr><td>2 · Bluegrass</td><td>4–1</td></tr><tr><td>3 · Twin Rivers</td><td>${state.played?'3–2':'3–1'}</td></tr><tr class="your-team"><td><strong>4 · Gateway</strong></td><td><strong>${state.played?'3–2':'2–2'}</strong></td></tr><tr><td>5 · Crossroads</td><td>1–4</td></tr></tbody></table></div></section><div class="stack"><section class="card"><h2>Saturday’s story</h2><p class="small muted" style="margin-top:12px">${state.played?'Gateway takes a step forward with a 31–24 home win.':'The sample week is ready. Your staff has prepared the team.'}</p>${btn(state.played?'View result →':'Play sample week →','advance','text-button')}</section><section class="card"><h2>History stays with you</h2><p class="small muted" style="margin-top:12px">Season archives, former players, and opponent histories will connect here.</p><div style="margin-top:14px">${pill('Planned','neutral')}</div></section></div></div>`}
function result(){return `<button class="back" data-action="home">← Back to your program</button><div class="grid"><div class="stack"><section class="card score-panel"><div class="eyebrow">Final · Week 6 · Sample result</div><div class="score-line"><div>${mark()}<strong class="score number">31</strong><span class="small">Gateway</span></div><span class="muted">—</span><div>${mark(true)}<strong class="score number">24</strong><span class="small">Twin Rivers</span></div></div><h1>A step forward.</h1><p>Gateway moves to 3–2 with a home win.</p></section><section class="card"><div class="eyebrow">Player spotlight</div><div class="person" style="margin-top:16px">${jersey()}<div><h2>Darren Price</h2><p>Freshman quarterback</p></div></div><div class="stat-callout"><div><strong>242</strong><span>Passing yards</span></div><div><strong>2</strong><span>Touchdowns</span></div><div><strong>1</strong><span>Interception</span></div></div><div class="divider"></div><p class="small muted">One good Saturday. His career is still taking shape.</p>${btn('View his career →','career','text-button')}</section></div><div class="stack"><section class="card"><h2>The week beyond the score</h2><div class="money-list">${item('Operating receipts','$180,000')}${item('Operating expenses','−$138,000')}${item('Net cash change','+$42,000')}${item('School cash',money(state.cash))}</div><p class="small muted">Fixed sample result, independent of your demo choices. No earnings or ratings are written to a career.</p></section><section class="card feature"><div class="eyebrow">Keep building</div><h2 style="margin:12px 0">What comes next?</h2><p class="small muted">Review your staff, follow your players, or choose where to invest.</p><div class="button-group">${btn('Return to Home','home','primary full')}</div></section></div></div>`}
function announce(text){clearTimeout(announceTimer);$('#announcement').textContent=text;announceTimer=setTimeout(()=>$('#announcement').textContent='',5000)}
function render(focus=true){$('#school').innerHTML=mark()+`<div><strong>Gateway State</strong><span class="muted">Archers · Saint Louis, MO</span></div>`;$('#season').textContent=`2027 SEASON · WEEK ${state.week}`;$('#nav').innerHTML=['home','players','staff','business','league'].map(k=>`<button data-action="${k}" ${state.screen===k||state.screen==='result'&&k==='home'?'aria-current="page"':''}>${icon(k)}<span>${k[0].toUpperCase()+k.slice(1)}</span></button>`).join('');$('#content').innerHTML=({home,players:player,staff,business,league,result}[state.screen])();if(focus){$('#content').focus({preventScroll:true});window.scrollTo(0,0)}}
function navigate(screen){state.screen=screen;render()}
function confirmAction(type){returnFocus=document.activeElement;pending=type;const offer={hire:{title:'Bring in Marcus Bell?',copy:'Demo selection only. The buyout reduces sample cash now. His salary and coaching effects are not simulated.',values:[['Buyout now','$50,000'],['Annual salary','$340,000'],['Additional salary / year','+$100,000'],['Contract obligation · 2 years','$680,000']],label:'Hire in demo'},facility:{title:'Invest in strength development?',copy:'Demo selection only. The project cost reduces sample cash now. Construction and development effects do not run.',values:[['Investment now','$180,000'],['Annual upkeep','$12,000'],['Completion','8 weeks'],['Cash after selection',money(state.cash-180000)]],label:'Select project'},media:{title:'Partner with Gateway Sports?',copy:'Select a sample local TV agreement. It reserves this illustrative offer; no weekly payments are simulated.',values:[['Weekly fee','$13,000'],['Term','8 weeks'],['Local TV rights','Exclusive'],['National rights','Retained']],label:'Select offer'}}[type];$('#dialog-title').textContent=offer.title;$('#dialog-copy').textContent=offer.copy;$('#dialog-values').innerHTML=offer.values.map(v=>item(...v)).join('');$('#accept').textContent=offer.label;$('#confirm').setAttribute('aria-labelledby','dialog-title');$('#confirm').setAttribute('aria-describedby','dialog-copy');$('#confirm').showModal();$('#cancel').focus()}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render(false);$(`[data-tab="${state.tab}"]`).focus();return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(['home','players','staff','business','league'].includes(a))navigate(a);else if(a==='career'||a==='agreements'){state.tab=a;navigate('players')}else if(a==='advance'){if(!state.played){state.played=true;state.week=7;state.cash+=42000}navigate('result')}else if(['hire','facility','media'].includes(a))confirmAction(a)});
$('#cancel').onclick=()=>$('#confirm').close();$('#confirm').addEventListener('close',()=>{pending=null;if(returnFocus?.isConnected)returnFocus.focus()});$('#accept').onclick=()=>{const action=pending;if(action==='hire'){state.hired=true;state.cash-=50000}else if(action==='facility'){state.facility=true;state.cash-=180000}else if(action==='media')state.media=true;$('#confirm').close();render(false);$('#content').focus({preventScroll:true});announce('Selected in demo. Your saved career is unchanged.')};$('#text-size').onclick=()=>{const large=document.body.classList.toggle('text-large');$('#text-size').setAttribute('aria-pressed',String(large));$('#text-size').textContent=large?'Text 200%':'Text 100%';announce(large?'Preview text enlarged to 200%.':'Preview text restored to 100%.')};$('#reset').onclick=()=>{state=initial();render();announce('Demo reset. All sample choices cleared.')};render(false);
</script>
</body></html>
